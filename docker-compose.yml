version: "3.8"
services:
  agent:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ANTHROPIC_API_KEY
      - WHAPI_TOKEN
      - GROQ_API_KEY
      - WHATSAPP_PROVIDER
      - DATABASE_URL
      - PORT
      - ENVIRONMENT
    volumes:
      - ./knowledge:/app/knowledge
      - ./config:/app/config
    restart: unless-stopped
